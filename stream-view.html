<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - ReLearn</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="Image.png" alt="Logo" class="site-logo">
            </a>
            <div class="flex-row gap-2" style="align-items: center;">
                <span class="btn" id="coinDisplay"
                    style="padding: 0.5rem 1rem; font-size: 0.9rem; pointer-events: none;">🪙 150 Coins</span>
                <nav>
                    <ul class="nav-links">
                        <li><a href="student-dashboard.html">Back</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container animate-fade" style="padding: 2rem 0;">
        <div class="flex-row gap-3" style="align-items: flex-start; flex-wrap: wrap;">

            <!-- Video Player (Left/Top) -->
            <div style="flex: 2; min-width: 300px;">
                <div class="video-container">
                    <div class="live-badge">LIVE</div>
                    <div class="stream-placeholder">
                        <div style="font-size: 4rem;">▶</div>
                        <p style="font-weight: 600; margin-top: 1rem;">Stream Simulation</p>
                    </div>
                </div>
                <div class="flex-between" style="margin-top: 1.5rem;">
                    <div>
                        <h1 style="font-size: 1.8rem;">Math: Q&A for Exam Prep</h1>
                        <p style="color: var(--color-text-muted); margin-top: 0.5rem;">Mr. Müller • 120 Viewers</p>
                    </div>
                </div>

                <!-- Donation Section -->
                <div class="card" style="margin-top: 2rem;">
                    <h3>Support the Teacher</h3>
                    <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Send coins as a thank you for the
                        lesson.</p>
                    <div class="flex-row gap-2" style="align-items: center;">
                        <input type="number" id="donationAmount" min="1" max="1000" placeholder="Amount (1-1000)"
                            class="search-input" style="width: 200px;">
                        <button class="btn btn-primary" onclick="donateCoins()">🪙 Donate</button>
                    </div>
                </div>
            </div>

            <!-- Chat (Right/Bottom) -->
            <div class="card chat-container" style="flex: 1; min-width: 300px;">
                <h3 style="border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                    Live Chat</h3>

                <div id="chatMessages" class="chat-messages">
                    <div class="chat-msg"><strong>Anna</strong>When are we covering derivatives?</div>
                    <div class="chat-msg"><strong>Max</strong>We already did that at the beginning.</div>
                    <div class="chat-msg" style="background: #f0f0f0;"><strong>Teacher-Bot</strong>Welcome to the
                        stream!
                        👋</div>
                </div>

                <div class="flex-row gap-1">
                    <input type="text" placeholder="Message..." class="search-input">
                    <button class="btn btn-primary" style="padding: 0 1.5rem;">➤</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        function donateCoins() {
            const input = document.getElementById('donationAmount');
            const amount = parseInt(input.value);
            const coinDisplay = document.getElementById('coinDisplay');

            // Simulating stored coins
            let currentCoins = 150;

            if (isNaN(amount) || amount < 1 || amount > 1000) {
                alert('Please enter an amount between 1 and 1000 coins.');
                return;
            }

            if (amount > currentCoins) {
                alert('Not enough coins! You only have ' + currentCoins + '.');
                return;
            }

            currentCoins -= amount;
            coinDisplay.textContent = '🪙 ' + currentCoins + ' Coins';

            // Add system message to chat
            const chatBox = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.innerHTML = '<span style="color: gold; font-weight: bold;">SYSTEM:</span> You donated ' + amount + ' coins! Thanks! 🎉';
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';
            alert('Thanks for donating ' + amount + ' coins!');
        }
    </script>
</body>

</html>
